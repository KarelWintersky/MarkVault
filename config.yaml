# config.yaml
site:
  title: "Нейроанализ Федерация: Основание"
  nav_title: "Документы"

content:
  # Каталог с документами. Относительный путь разрешается от корня приложения.
  path: content

  # Документ, который открывается, когда в адресе нет ?file=
  default_file: "README.md"

  # Как показывать папки в навигации: opened | collapsed
  # Ветка с открытым документом всё равно раскрывается автоматически.
  folders: collapsed

titles:
  # === Основной корпус (00–14) ===
  "00-overview.md":              "Обзор"
  "01-timeline.md":              "Хронология"
  "02-earth-backstory.md":       "Предыстория Земли"
  "03-planet-aurora.md":         "Планета Аврора"
  "04-biosphere.md":             "Биосфера"
  "05-factions.md":              "Фракции"

  # === Подраздел фракций (05a–05e) ===
  "05a-landing.md":              "Фракции: Лэндинг"
  "05b-technograd.md":           "Фракции: Техноград"
  "05c-syndicate.md":            "Фракции: Синдикат"
  "05d-control.md":              "Фракции: Контроль"
  "05e-volniki.md":              "Фракции: Вольники"

  # === Продолжение корпуса (06–14) ===
  "06-longers.md":               "Долгожители"
  "07-society.md":               "Общество"
  "08-economy.md":               "Экономика"
  "09-technology.md":            "Технологии"
  "10-religion.md":              "Религия"
  "11-psionics-and-artifacts.md": "Странное"
  "12-media.md":                 "Медиа"
  "13-characters.md":            "Персонажи"
  "14-glossary.md":              "Глоссарий"

  # === Служебное ===
  "Questions/":                   "Deepseek"
  "README.md":                   "Главная"
  "QUESTIONS.md":                "Открытые вопросы"

sort:
  # Каталоги в навигации идут раньше файлов, на каждом уровне: сначала
  # папки по алфавиту, потом файлы по алфавиту. По умолчанию true.
  # false — сплошная сортировка по пути, как было раньше.
  folders_first: true

  before_all:
    - "README.md"
    - "00-overview.md"
  after_all:
    - "QUESTIONS.md"

# Список файлов и папок, которые не показывать в навигации
hide:
  - index.php
  - vendor
  - composer.json
  - composer.lock
  - .git
  - .gitignore
  - test.php
  - config.yaml

theme:
  # Тема по умолчанию: dark | light
  default: light

  dark:
    bg: "#0f1115"
    panel: "#161920"
    text: "#e6e8eb"
    muted: "#9aa0a6"
    accent: "#5b9df9"
    code_bg: "#1e222a"
    border: "#2a2f3a"

  light:
    bg: "#faf9f7"
    panel: "#f2f0eb"
    text: "#232323"
    muted: "#6b6b6b"
    accent: "#0366d6"
    code_bg: "#f6f8fa"
    border: "#e1e4e8"

# 🔒 Защита файлов паролем.
# Если секция отсутствует или пуста — защита отключена целиком.
protected:
  password: "password"

  # Список файлов (относительные пути от корня контента).
  # Можно указывать как точный файл, так и всю папку (тогда защищены все .md внутри).
  files:
    - "06-longers.md"
    - "Questions/"

  # Метка для защищённых файлов в списке
  lock_icon: "🔒"
  title: "Файл защищён"
  hint: "Введите пароль для доступа"

  # Показывать ли защищённые файлы в оглавлении. По умолчанию true.
  # При false файлы скрыты от тех, кто ещё не ввёл пароль (у вошедших
  # они видны как обычно), но по прямой ссылке по-прежнему спрашивается пароль.
  # visible: false