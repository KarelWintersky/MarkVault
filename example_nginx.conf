# MarkVault — виртуальный хост книги «Синеглазка».
#
# Раскладка:
#   код           /var/www.projects/MarkVault/markvault.phar
#   конфиг книги  /var/www.books/Book.Cornflower/config.yaml
#   документы     /var/www.books/Book.Cornflower/content/
#
# Включение:
#   ln -s /var/www.projects/MarkVault/example_nginx.conf \
#         /etc/nginx/sites-enabled/cornflower.book.local
#   nginx -t && sudo systemctl reload nginx
#
# Имя хоста резолвится локально, без DNS:
#   127.0.0.1  cornflower.book.local   (в /etc/hosts)
#
# ---------------------------------------------------------------------------
# ТРЕБОВАНИЕ К PHP-FPM, без него будет 403
#
# FPM по умолчанию исполняет только .php и отвечает на .phar отказом
# («Access denied»). Расширение разрешается в пуле, а не в nginx:
#
#   /etc/php82/php-fpm.d/www.conf
#       security.limit_extensions = .php .phar
#   sudo systemctl restart php82-fpm
#
# На этой машине проверка уже проходит: /usr/bin/php-fpm82 — локальная сборка
# (не пакет dpkg), и в ней значение по умолчанию уже «.php .phar»:
#
#   $ php-fpm82 -tt --fpm-config /etc/php82/php-fpm.conf | grep limit_extensions
#   [NOTICE]  security.limit_extensions = .php .phar
#
# На стоковом PHP-FPM такой строки в /usr/bin не будет, и править пул нужно.
# ---------------------------------------------------------------------------


server {
    listen      80;
    server_name cornflower.book.local;

    access_log  /var/log/nginx/cornflower.book.local.access.log;
    error_log   /var/log/nginx/cornflower.book.local.error.log;

    # Каталог с самим архивом. Статикой из него не отдаём ничего: рядом лежат
    # config.yaml, composer.json, box.phar и content/ — наружу это выходить не
    # должно. Поэтому ниже нет try_files на $uri, и весь трафик уходит в PHP.
#    root        /var/www.projects/MarkVault;
# на самом деле указывать на каталог с файлами MarkVault не обязательно, можно сказать и
    root        /var/www.books/Book.Cornflower/;

    location / {
        include        fastcgi_params;

        # Исполняемый файл — сам PHAR: он уже содержит и app/, и vendor/, и
        # подключает себя сам. Путь передаётся как есть, без
        # $fastcgi_script_name: подстановка индекса дала бы FPM имя .php
        # вместо .phar, и тот отказал бы на проверке расширений.
        #
        # index.php из этого же каталога в качестве SCRIPT_FILENAME не
        # годится: он лишь запустил бы лежащий рядом phar вторым шагом.
        fastcgi_param  SCRIPT_FILENAME   /var/www.projects/MarkVault/markvault.phar;

        # Конфиг приходит параметром — код лежит в каталоге проекта, а данные
        # в /var/www.books, и относительный content.path разрешается от
        # каталога конфига, поэтому "./content" ищется рядом с config.yaml.
        #
        # Свой fastcgi_param обязан идти ПОСЛЕ include fastcgi_params:
        # иначе значения перекроются общими из fastcgi.conf.
        fastcgi_param  MARKVAULT_CONFIG  /var/www.books/Book.Cornflower/config.yaml;

        # php-handler-8 — upstream из /etc/nginx/conf.d/upstream-php-handler-8.conf,
        # то есть unix:/run/php82-fpm/php-fpm.sock. MarkVault требует PHP 8.2+,
        # поэтому не php-handler-7 (это 7.4).
        fastcgi_pass   php-handler-8;
    }
}
